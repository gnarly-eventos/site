<style>
/* Marca Gnarly: preto, branco e verde ácido. A Gnarly é o carimbo; cada ingresso leva a cor da própria festa. */
:root{
  --preto:#0A0A0A; --branco:#F4F4EF; --acido:#C8FF1F; --cinza:#8b8b86; --linha:#222;
  --f-marca:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
body{
  background:var(--preto); color:var(--branco); font-family:var(--f-marca); font-weight:600;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:44px 0;
}
main{max-width:520px; margin:0 auto; display:flex; flex-direction:column; gap:30px}
header{display:grid; gap:10px}
.marca{display:block; width:100%; height:auto; color:var(--branco)}
.eventos{justify-self:end; font-size:clamp(.8rem,3.4vw,1.05rem); letter-spacing:.62em; margin-right:-.62em; color:var(--branco)}
.assinatura{margin:6px 0 0; font-weight:900; font-size:clamp(1.9rem,9vw,2.8rem); line-height:.98; letter-spacing:-.03em; color:var(--acido)}

.lista{display:flex; flex-direction:column; gap:14px; margin:0; padding:0; list-style:none}
.ingresso{
  --a:#000; --b:#000; --t:#fff; --s:#fff;
  position:relative; display:grid; grid-template-columns:1fr 88px; min-height:124px;
  color:var(--t); text-decoration:none; border-radius:12px;
  background:linear-gradient(135deg,var(--a),var(--b));
  -webkit-mask:
    radial-gradient(circle 11px at calc(100% - 88px) 0,#0000 98%,#000) top/100% 51% no-repeat,
    radial-gradient(circle 11px at calc(100% - 88px) 100%,#0000 98%,#000) bottom/100% 51% no-repeat;
          mask:
    radial-gradient(circle 11px at calc(100% - 88px) 0,#0000 98%,#000) top/100% 51% no-repeat,
    radial-gradient(circle 11px at calc(100% - 88px) 100%,#0000 98%,#000) bottom/100% 51% no-repeat;
  transition:transform .18s ease, filter .18s ease;
}
.ingresso:hover{transform:translateY(-3px); filter:brightness(1.08)}
.ingresso:focus-visible{outline:none; filter:brightness(1.15)}
.ingresso:focus-visible .corpo{box-shadow:inset 0 0 0 3px var(--acido)}
.corpo{display:flex; align-items:center; justify-content:center; padding:14px 16px; min-width:0; border-radius:12px 0 0 12px}
.corpo img{width:100%; max-width:290px; height:auto; display:block; filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
.canhoto{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
  border-left:2px dashed color-mix(in srgb,var(--t) 40%,transparent); text-align:center; padding:12px 6px}
.canhoto b{font-size:.66rem; letter-spacing:.14em; text-transform:uppercase; line-height:1.3}
.canhoto i{font-style:normal; width:34px; height:34px; border-radius:50%; display:grid; place-items:center; background:var(--s); color:var(--a); font-size:1.1rem; font-weight:900}

.antr{--a:#0b1638; --b:#1c2f6b; --t:#f3e2a6; --s:#d4af37}
.antr .canhoto b{font-family:"Cinzel",Georgia,serif; letter-spacing:.08em}
.antr .corpo{background:radial-gradient(circle at 20% 30%,rgba(255,255,255,.08) 0 1px,transparent 2px) 0 0/22px 22px}
.nost{--a:#5b1a8c; --b:#c42b2b; --t:#fff4c2; --s:#ffd23f}
.nost .canhoto b{font-family:"Bungee",Impact,sans-serif; font-weight:400; letter-spacing:.04em}
.nost .corpo{background:repeating-conic-gradient(from 0deg at 50% 50%, rgba(255,210,63,.12) 0 10deg, transparent 10deg 20deg)}
.mj{--a:#2a0f52; --b:#c2185b; --t:#fff3d6; --s:#ffb300}
.mj .canhoto b{font-family:"Press Start 2P",ui-monospace,monospace; font-weight:400; font-size:.5rem; letter-spacing:.02em; line-height:1.7}
.mj .corpo{background:repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 2px, transparent 2px 4px)}
.lov{--a:#0b0709; --b:#5a0d3a; --t:#ffe3f1; --s:#ff1f8c}
.lov .canhoto b{font-family:"Anton",Impact,sans-serif; font-weight:400; font-size:.8rem; letter-spacing:.1em}
.lov .corpo img{max-width:250px; filter:drop-shadow(0 0 12px rgba(255,31,140,.5))}

footer{margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))); margin-top:10px; background:var(--acido); color:var(--preto);
  padding:22px max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)); display:grid; gap:6px; font-size:.92rem; line-height:1.5}
footer strong{font-weight:900; font-size:1.05rem; letter-spacing:.02em}
footer a{color:var(--preto); font-weight:900}
.rodape-miolo{max-width:520px; margin:0 auto; width:100%; display:grid; gap:6px}

@media (max-width:380px){
  .ingresso{grid-template-columns:1fr 76px; min-height:108px;
    -webkit-mask:
      radial-gradient(circle 10px at calc(100% - 76px) 0,#0000 98%,#000) top/100% 51% no-repeat,
      radial-gradient(circle 10px at calc(100% - 76px) 100%,#0000 98%,#000) bottom/100% 51% no-repeat;
            mask:
      radial-gradient(circle 10px at calc(100% - 76px) 0,#0000 98%,#000) top/100% 51% no-repeat,
      radial-gradient(circle 10px at calc(100% - 76px) 100%,#0000 98%,#000) bottom/100% 51% no-repeat;}
}
@media (prefers-reduced-motion:reduce){.ingresso{transition:none}.ingresso:hover{transform:none}}
</style>
</head>
<body>
