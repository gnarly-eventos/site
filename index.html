<style>
/* Marca Gnarly: preto, branco e verde ácido. A Gnarly é o carimbo; cada ingresso leva a cor da própria festa. */
:root{
  --preto:#0A0A0A; --branco:#F4F4EF; --acido:#C8FF1F; --cinza:#8b8b86; --linha:#222;
  --f-marca:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
body{
  background:var(--preto); color:var(--branco); font-family:var(--f-marca); font-weight:600;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:44px 0;
}
main{max-width:520px; margin:0 auto; display:flex; flex-direction:column; gap:30px}
header{display:grid; gap:10px}
.marca{display:block; width:100%; height:auto; color:var(--branco)}
.eventos{justify-self:end; font-size:clamp(.8rem,3.4vw,1.05rem); letter-spacing:.62em; margin-right:-.62em; color:var(--branco)}
.assinatura{margin:6px 0 0; font-weight:900; font-size:clamp(1.9rem,9vw,2.8rem); line-height:.98; letter-spacing:-.03em; color:var(--acido)}

.lista{display:flex; flex-direction:column; gap:14px; margin:0; padding:0; list-style:none}
.ingresso{
  --a:#000; --b:#000; --t:#fff; --s:#fff;
  position:relative; display:grid; grid-template-columns:1fr 88px; min-height:124px;
  color:var(--t); text-decoration:none; border-radius:12px;
  background:linear-gradient(135deg,var(--a),var(--b));
  -webkit-mask:
    radial-gradient(circle 11px at calc(100% - 88px) 0,#0000 98%,#000) top/100% 51% no-repeat,
    radial-gradient(circle 11px at calc(100% - 88px) 100%,#0000 98%,#000) bottom/100% 51% no-repeat;
          mask:
    radial-gradient(circle 11px at calc(100% - 88px) 0,#0000 98%,#000) top/100% 51% no-repeat,
    radial-gradient(circle 11px at calc(100% - 88px) 100%,#0000 98%,#000) bottom/100% 51% no-repeat;
  transition:transform .18s ease, filter .18s ease;
}
.ingresso:hover{transform:translateY(-3px); filter:brightness(1.08)}
.ingresso:focus-visible{outline:none; filter:brightness(1.15)}
.ingresso:focus-visible .corpo{box-shadow:inset 0 0 0 3px var(--acido)}
.corpo{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:14px 16px; min-width:0; border-radius:12px 0 0 12px}
.prox{display:block; max-width:100%; font-size:.78rem; font-weight:900; letter-spacing:.06em; line-height:1.25; text-align:center; text-transform:uppercase; padding:4px 10px; border-radius:6px; background:var(--pb,rgba(0,0,0,.45)); color:var(--pt,#fff)}
.prox b{display:block; font-size:.68rem; letter-spacing:.1em; color:var(--s)}
.corpo img{width:100%; max-width:290px; height:auto; display:block; filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
.canhoto{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
  border-left:2px dashed color-mix(in srgb,var(--t) 40%,transparent); text-align:center; padding:12px 6px}
.canhoto b{font-size:.66rem; letter-spacing:.14em; text-transform:uppercase; line-height:1.3}
.canhoto i{font-style:normal; width:34px; height:34px; border-radius:50%; display:grid; place-items:center; background:var(--s); color:var(--a); font-size:1.1rem; font-weight:900}

/* A Night To Remember: ginásio do colégio (vermelho, branco e dourado) */
.antr{--a:#7d0a1c; --b:#c8102e; --t:#fffdf7; --s:#f2b632; --pb:#150a05; --pt:#ffb000}
.antr .canhoto b{font-family:"Graduate","Rockwell",Georgia,serif; font-weight:400; letter-spacing:.06em}
.antr .canhoto i{color:#7d0a1c}
.antr .corpo{background:radial-gradient(circle,rgba(255,253,247,.5) 0 2px,transparent 2.600px) 2px 4px/24px 22px,radial-gradient(circle,rgba(242,182,50,.55) 0 2px,transparent 2.600px) 14px 15px/24px 22px}
.antr .prox b{color:#fffdf7}
/* Nostalgias 2000: raios amarelos */
.nost{--a:#ffd60a; --b:#ffd60a; --t:#3b2416; --s:#7b2cbf; --pb:#fff6e0; --pt:#ff2e4d}
.nost{background:radial-gradient(60% 90% at 38% 50%,rgba(255,143,199,.85),rgba(255,143,199,0) 70%),repeating-conic-gradient(from 0deg at 38% 50%,#ffd60a 0 10deg,#ffe873 10deg 20deg)}
.nost .canhoto b{font-family:"Bungee",Impact,sans-serif; font-weight:400; letter-spacing:.04em}
.nost .canhoto i{color:#ffd60a}
.nost .prox{box-shadow:0 0 0 2px #3b2416}
.nost .prox b{color:#7b2cbf}
/* Festa do Michael: palco preto com uma luz de cima e fio vermelho */
.mj{--a:#050506; --b:#050506; --t:#f4f2ed; --s:#e8112d; --pb:#000; --pt:#f4f2ed; box-shadow:inset 0 0 0 1px #2c2c31,inset 0 -3px 0 #e8112d}
.mj .canhoto b{font-weight:900}
.mj .canhoto i{color:#fff}
.mj .corpo{background:conic-gradient(from 150deg at 50% -30%,rgba(255,255,255,0) 0deg,rgba(255,255,255,.12) 14deg,rgba(255,255,255,.26) 30deg,rgba(255,255,255,.12) 46deg,rgba(255,255,255,0) 60deg)}
.mj .prox{box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.mj .prox b{color:#ff5a6e}
/* Lovatic Experience: galpão escuro com luz rosa */
.lov{--a:#0b0709; --b:#5a0d3a; --t:#ffe3f1; --s:#ff1f8c; --pb:#000; --pt:#ffe3f1}
.lov .canhoto b{font-family:"Anton",Impact,sans-serif; font-weight:400; font-size:.8rem; letter-spacing:.1em}
.lov .corpo{box-shadow:inset 7px 0 0 #ff1f8c,inset 20px 0 26px -10px rgba(255,31,140,.7)}
.lov .corpo img{max-width:250px; filter:drop-shadow(0 0 12px rgba(255,31,140,.5))}
.lov .prox{box-shadow:inset 0 0 0 1px #ff1f8c}
/* Festa do Harry Styles: cartaz anos 70, creme com raios e xadrez rosa */
.hs{--a:#fff3df; --b:#fff3df; --t:#3a1430; --s:#e63b2e; --pb:#3a1430; --pt:#fff3df}
.hs{background:conic-gradient(#ff5fa2 25%,#fff3df 0 50%,#ff5fa2 0 75%,#fff3df 0) 0 0/16px 16px}
.hs .corpo{margin:8px 0 8px 8px; padding:12px 6px; border-radius:8px; background:repeating-conic-gradient(from 0deg at 50% 60%,#ffe6c4 0 10deg,#fff3df 10deg 20deg)}
.hs .canhoto{margin:8px 8px 8px 0; border-radius:8px; background:#fff3df; border-left-color:#3a1430}
.hs .canhoto b{font-family:"Nunito",system-ui,sans-serif; font-weight:900}
.hs .canhoto i{color:#fff}
.hs .prox{font-size:.72rem; letter-spacing:.04em}
.hs .prox b{color:#ffc93c}
.hs .corpo img{max-width:270px; filter:drop-shadow(3px 3px 0 rgba(58,20,48,.85))}

footer{margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))); margin-top:10px; background:var(--acido); color:var(--preto);
  padding:22px max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)); display:grid; gap:6px; font-size:.92rem; line-height:1.5}
footer strong{font-weight:900; font-size:1.05rem; letter-spacing:.02em}
footer a{color:var(--preto); font-weight:900}
.rodape-miolo{max-width:520px; margin:0 auto; width:100%; display:grid; gap:6px}

@media (max-width:380px){
  .ingresso{grid-template-columns:1fr 76px; min-height:108px;
    -webkit-mask:
      radial-gradient(circle 10px at calc(100% - 76px) 0,#0000 98%,#000) top/100% 51% no-repeat,
      radial-gradient(circle 10px at calc(100% - 76px) 100%,#0000 98%,#000) bottom/100% 51% no-repeat;
            mask:
      radial-gradient(circle 10px at calc(100% - 76px) 0,#0000 98%,#000) top/100% 51% no-repeat,
      radial-gradient(circle 10px at calc(100% - 76px) 100%,#0000 98%,#000) bottom/100% 51% no-repeat;}
}
@media (prefers-reduced-motion:reduce){.ingresso{transition:none}.ingresso:hover{transform:none}}
</style>
</head>
<body>

<main>
  <header>
    <h1 style="margin:0"><svg class="marca" viewBox="-4 -4 988 208" role="img" aria-label="Gnarly"><g fill="currentColor" fill-rule="evenodd" stroke="currentColor" stroke-width="8" stroke-linejoin="round"><path transform='translate(0,0)' d='M0,0 L150,0 L150,66 L62,66 L62,134 L86,134 L86,90 L150,90 L150,200 L0,200Z'/><path transform='translate(174,0)' d='M0,0 L92,0 L92,125 L116,125 L116,0 L150,0 L150,200 L58,200 L58,75 L34,75 L34,200 L0,200Z'/><path transform='translate(348,0)' d='M0,60 L36,0 L114,0 L150,60 L150,200 L87,200 L87,122 L63,122 L63,200 L0,200ZM60,52 L90,52 L90,80 L60,80Z'/><path transform='translate(522,0)' d='M0,0 L150,0 L150,92 L112,92 L112,116 L150,116 L150,200 L87,200 L87,130 L63,130 L63,200 L0,200ZM58,48 L94,48 L94,74 L58,74Z'/><path transform='translate(696,0)' d='M0,0 L50,0 L50,150 L110,150 L110,200 L0,200Z'/><path transform='translate(830,0)' d='M0,0 L63,0 L63,78 L87,78 L87,0 L150,0 L150,70 L102,122 L102,200 L48,200 L48,122 L0,70Z'/></g></svg></h1>
    <span class="eventos">EVENTOS</span>
    <p class="assinatura">Festa de fã<br>pra fã.</p>
  </header>

  <ul class="lista">
    <li>
      <a class="ingresso antr" href="https://ingressos.gnarlyeventos.com.br/antr" aria-label="A Night To Remember: ingressos">

        <span class="corpo"><img src="logo-nostalgias.webp" alt="Nostalgias 2000" width="600" height="214"><span class="prox" id="prox-nost" hidden></span></span>
        <span class="canhoto"><b>Ingressos</b><i aria-hidden="true">→</i></span>
      </a>
    </li>

      <a class="ingresso mj" href="https://michael.gnarlyeventos.com.br/" aria-label="Festa do Michael Jackson: ingressos">
        <span class="corpo"><img src="logo-michael.webp" alt="Festa do Michael Jackson" width="600" height="295"><span class="prox" id="prox-mj" hidden></span></span>

      <a class="ingresso lov" href="https://lovatic.gnarlyeventos.com.br/" aria-label="Lovatic Experience: ingressos">
        <span class="corpo"><img src="logo-lovatic.webp" alt="Lovatic Experience" width="720" height="194"><span class="prox" id="prox-lov" hidden></span></span>
        <span class="canhoto"><b>Ingressos</b><i aria-hidden="true">→</i></span>

        <span class="corpo"><img src="logo-harry.webp" alt="Festa do Harry Styles" width="900" height="326"><span class="prox" id="prox-hs" hidden></span></span>
        <span class="canhoto"><b>Ingressos</b><i aria-hidden="true">→</i></span>
      </a>

</main>
<footer>
  <div class="rodape-miolo">
    <strong>PARA MAIORES DE 18 ANOS</strong>
    <span>Obrigatório apresentação de documento original com foto</span>
    <span>Atendimento no WhatsApp <a href="https://wa.me/5511957293333">(11) 95729-3333</a></span>
  </div>
</footer>
<script>
/* Próxima data de cada festa: lê o eventos.json que o robô de cada página já publica.
   Se não conseguir ler, o ingresso aparece só com o logo. */
(function(){
  var ORIGEM={
    antr:["https://ingressos.gnarlyeventos.com.br/eventos.json",/night\s*to\s*remember/i],
    nost:["https://ingressos.gnarlyeventos.com.br/eventos.json",/nostalgias/i],
    mj:["https://michael.gnarlyeventos.com.br/eventos.json",/./],
    lov:["https://lovatic.gnarlyeventos.com.br/eventos.json",/./],
    hs:["https://harry.gnarlyeventos.com.br/eventos.json",/./]
  };
  var previa=null;try{previa=JSON.parse(document.getElementById("previa").textContent)}catch(e){}
  var cache={};
  function busca(u){return cache[u]||(cache[u]=fetch(u,{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){return Array.isArray(d)?d:(d.eventos||[])}))}
  function f(d,o){o.timeZone="America/Sao_Paulo";return new Intl.DateTimeFormat("pt-BR",o).format(d).replace(".","").toUpperCase()}
  function pinta(k,lista){
    var agora=Date.now();
    var l=lista.filter(function(e){return e.publicado!==false&&!e.cancelado&&ORIGEM[k][1].test(e.nome||"")&&new Date(e.fim).getTime()>agora})
      .sort(function(a,b){return new Date(a.inicio)-new Date(b.inicio)});
    var el=document.getElementById("prox-"+k);if(!l.length||!el)return;
    var d=new Date(l[0].inicio);
    el.innerHTML="";el.appendChild(document.createTextNode(l[0].cidade+" · "+f(d,{weekday:"short"})+" "+f(d,{day:"2-digit"})+" "+f(d,{month:"short"})));
    var b=document.createElement("b");b.textContent=l.length===1?"1 data à venda":l.length+" datas à venda";el.appendChild(b);
    el.hidden=false;
  }
  Object.keys(ORIGEM).forEach(function(k){
    busca(ORIGEM[k][0]).then(function(l){pinta(k,l)}).catch(function(){if(previa&&previa[k])pinta(k,previa[k])});
  });
})();
document.addEventListener("click",function(e){var a=e.target.closest(".ingresso");if(!a)return;try{if(window.gtag)gtag("event","clique_festa",{festa:a.classList[1],festa_origem:"gnarly"})}catch(_){}
if(e.target.closest("footer a"))try{gtag("event","clique_whatsapp",{origem:"gnarly"})}catch(_){}});
</script>
